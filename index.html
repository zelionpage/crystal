
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d14">

  <title>Crystal 2</title>
  <meta name="description" content="Crystal 2 - Your smart companion is ready.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #080d14;
      color: #f5faff;
    }

    .container {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .logo {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin: 0 auto 25px;
      border-radius: 18px;
      background: #10283a;
      color: #65d5ff;
      font-size: 28px;
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    h1 span {
      color: #65d5ff;
    }

    .description {
      color: #91a5b5;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .status {
      color: #65d5ff;
      font-size: 12px;
      margin-bottom: 22px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      background: #168fc5;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: .2s;
    }

    .button:hover {
      background: #20a9e5;
    }

    .button:active {
      transform: scale(.98);
    }

    footer {
      margin-top: 65px;
      color: #667785;
      font-size: 12px;
    }

    footer a {
      color: #65d5ff;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">✦</div>

    <h1>Crystal <span>2</span></h1>

    <p class="description">
      Your smart companion is ready.<br>
      Continue your experience through WhatsApp.
    </p>

    <p class="status">
      ● Ready to connect
    </p>

    <a
      class="button"
      href="https://wa.me/6281248030605"
      target="_blank"
      rel="noopener noreferrer"
    >
      Continue to WhatsApp ↗
    </a>

    <footer>
      © 2026
      <a href="https://hostinginzel.my.id">
        SkyGhostID
      </a>
    </footer>

  </main>

</body>
</html>
