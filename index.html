
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090817">
  <title>Crystal 2 | Your AI Companion</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 50% 35%, #30205e 0%, transparent 40%),
        linear-gradient(145deg, #090817, #111027 60%, #090817);
      overflow: hidden;
    }

    .glow {
      position: fixed;
      width: 260px;
      height: 260px;
      background: #8b5cf6;
      filter: blur(130px);
      opacity: .25;
      border-radius: 50%;
      pointer-events: none;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 430px;
      padding: 42px 28px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      background: rgba(255,255,255,.055);
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 80px rgba(0,0,0,.4);
      animation: appear .8s ease;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      font-size: 38px;
      background: linear-gradient(135deg, #a78bfa, #6d28d9);
      box-shadow: 0 0 40px rgba(139,92,246,.4);
    }

    h1 {
      font-size: 32px;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    h1 span {
      color: #a78bfa;
    }

    .subtitle {
      color: #aaa6c3;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: #c4b5fd;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #a78bfa;
      box-shadow: 0 0 12px #a78bfa;
      animation: pulse 1.2s infinite;
    }

    .progress {
      height: 4px;
      background: rgba(255,255,255,.1);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 26px;
    }

    .progress span {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #8b5cf6, #c4b5fd);
      animation: load 3s linear forwards;
    }

    .button {
      display: block;
      padding: 15px;
      border-radius: 14px;
      color: white;
      font-weight: bold;
      font-size: 14px;
      text-decoration: none;
      background: linear-gradient(100deg, #7c3aed, #9333ea);
      box-shadow: 0 8px 25px rgba(124,58,237,.25);
      transition: .25s;
    }

    .button:active {
      transform: scale(.97);
    }

    .note {
      margin-top: 19px;
      color: #77738f;
      font-size: 11px;
      line-height: 1.6;
    }

    @keyframes pulse {
      50% { opacity: .35; }
    }

    @keyframes load {
      to { width: 100%; }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="glow"></div>

  <main class="container">
    <div class="logo">✦</div>

    <h1>Crystal <span>2</span></h1>

    <p class="subtitle">
      A smarter connection starts here.<br>
      Your Crystal experience is just one step away.
    </p>

    <div class="status">
      <span class="dot"></span>
      Connecting to WhatsApp...
    </div>

    <div class="progress">
      <span></span>
    </div>

    <a class="button" href="https://wa.me/6281248030605">
      Continue to WhatsApp ↗
    </a>

    <p class="note">
      If you have WhatsApp installed, it may open automatically.
      Otherwise, you can continue through WhatsApp Web.
      <br><br>
      © 2026 Crystal 2
    </p>
  </main>

  <script>
    setTimeout(() => {
      window.location.replace("https://wa.me/6281248030605");
    }, 3000);
  </script>
</body>
</html>
